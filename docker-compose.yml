services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rsvp
      POSTGRES_USER: rsvp
      POSTGRES_PASSWORD: rsvp
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://rsvp:rsvp@db:5432/rsvp?sslmode=disable
      JWT_SECRET: change-me-in-production
      PORT: 8080
      FRONTEND_ORIGIN: http://localhost:5173
    ports: ["8080:8080"]
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  pgdata:
